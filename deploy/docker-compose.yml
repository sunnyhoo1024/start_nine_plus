# Start Nine Plus — production-oriented stack
# Usage (from deploy/):
#   cp ../.env.example ../.env   # edit secrets
#   docker compose --env-file ../.env up -d --build
#
# Local infra only (MySQL + Redis):
#   docker compose --env-file ../.env up -d mysql redis

name: start-nine-plus

services:
  mysql:
    # Pin 8.0: mysql:8 now resolves to 8.4, which removed default-authentication-plugin
    image: mysql:8.0
    container_name: snp-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-start_nine_plus}
      MYSQL_USER: ${MYSQL_USER:-snp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-snp_change_me}
      TZ: Asia/Shanghai
    volumes:
      - snp-mysql-data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7
    container_name: snp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - snp-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  admin-api:
    build:
      context: ../services
      dockerfile: ../deploy/Dockerfile.admin-api
    container_name: snp-admin-api
    restart: unless-stopped
    expose:
      - "8081"
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-api:
    build:
      context: ../services
      dockerfile: ../deploy/Dockerfile.app-api
    container_name: snp-app-api
    restart: unless-stopped
    expose:
      - "8082"
    ports:
      - "8082:8082"
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WECHAT_MOCK: ${WECHAT_MOCK:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Multi-stage Node build + nginx: serves admin-web static and proxies APIs
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin-web
    container_name: snp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - admin-api
      - app-api

volumes:
  snp-mysql-data:
  snp-redis-data:
