worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream admin_api {
        server admin-api:8081;
    }

    upstream app_api {
        server app-api:8082;
    }

    server {
        listen 80;
        server_name _;

        # Admin SPA (Vue/Vite build output)
        root /usr/share/nginx/html;
        index index.html;

        # Optional: restrict admin UI by IP (uncomment and set offices VPN CIDRs)
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;

        location /admin/api/ {
            proxy_pass http://admin_api/admin/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location /app/api/ {
            proxy_pass http://app_api/app/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # SPA history fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}
