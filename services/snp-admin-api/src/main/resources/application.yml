server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path:

spring:
  application:
    name: snp-admin-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:start_nine_plus}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

snp:
  jwt:
    secret: ${JWT_SECRET:change-me-snp-jwt-secret-key-32bytes!!}
    expire-hours: ${JWT_EXPIRE_HOURS:72}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    secret: ${WECHAT_SECRET:}
    mock: ${WECHAT_MOCK:true}

logging:
  level:
    com.snp: INFO
